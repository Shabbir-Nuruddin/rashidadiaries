name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # .nojekyll tells Pages to serve the built files as-is (no Jekyll),
      # so nothing rewrites our index.html or hides the assets folder.
      - run: touch dist/.nojekyll
      # This branch contains built assets only; Vercel must deploy the source branch.
      - name: Disable Vercel deployments of the generated Pages branch
        run: |
          node -e 'require("fs").writeFileSync("dist/vercel.json", JSON.stringify({git:{deploymentEnabled:false}}, null, 2))'
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
